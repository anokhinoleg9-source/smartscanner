<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartScan — Умный сканер учебников 24/7</title>
    <style>
        :root {
            --bg: #090d16;
            --card: #131b2e;
            --primary: #3b82f6;
            --accent: #6366f1;
            --success: #10b981;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 75%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .scanner-card {
            width: 100%;
            max-width: 430px;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 26px;
            padding: 22px 18px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.65);
            text-align: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #6ee7b7;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 999px;
            margin-bottom: 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13.5px;
            color: var(--muted);
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .camera-box {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: 370px;
            background: #050811;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.12);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, #freezeCanvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #freezeCanvas {
            display: none;
        }

        .camera-fallback-msg {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--muted);
            font-size: 14px;
            gap: 10px;
        }

        .reticle {
            position: absolute;
            inset: 18px;
            pointer-events: none;
            border-radius: 16px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.28);
        }

        .corner {
            position: absolute;
            width: 26px;
            height: 26px;
            border-color: #60a5fa;
            border-style: solid;
            border-width: 0;
        }
        .tl { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 10px; }
        .tr { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 10px; }
        .bl { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 10px; }
        .br { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 10px; }

        .scan-laser {
            display: none;
            position: absolute;
            left: 20px;
            right: 20px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #3b82f6, #ec4899, #3b82f6, transparent);
            box-shadow: 0 0 16px #3b82f6;
            animation: laserScan 1.5s ease-in-out infinite;
        }

        @keyframes laserScan {
            0%, 100% { top: 22px; }
            50% { top: calc(100% - 22px); }
        }

        .scan-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px 22px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 26px -6px rgba(59, 130, 246, 0.6);
            transition: transform 0.12s ease;
        }

        .scan-btn:active {
            transform: scale(0.97);
        }

        .aux-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .aux-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--muted);
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
        }

        .status-box {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 16px;
            text-align: left;
        }

        .status-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        .status-desc {
            font-size: 13.5px;
            color: var(--muted);
            line-height: 1.45;
        }

        .direct-link-btn {
            display: none;
            width: 100%;
            text-align: center;
            padding: 13px;
            background: var(--success);
            color: #032b13;
            font-weight: 700;
            font-size: 15px;
            border-radius: 12px;
            text-decoration: none;
            margin-top: 10px;
        }

        .reset-btn {
            display: none;
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--muted);
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

<div class="scanner-card">
    <div class="status-badge">
        <span class="dot"></span>
        <span>Визуальный ИИ 24/7 (без VPN)</span>
    </div>

    <h1>Сканер обложек учебников</h1>
    <p class="subtitle">Наведите камеру на обложку (даже без текста) и нажмите кнопку — сразу откроется учебник</p>

    <div class="camera-box">
        <video id="videoEl" autoplay playsinline muted></video>
        <canvas id="freezeCanvas"></canvas>
        <div class="camera-fallback-msg" id="fallbackMsg">
            <div style="font-size: 36px;">📷</div>
            <div>Нажмите «Зафиксировать обложку» для съемки</div>
        </div>

        <div class="reticle">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
        </div>
        <div class="scan-laser" id="laserEl"></div>
    </div>

    <button class="scan-btn" id="scanBtn" type="button">
        <span>📸</span>
        <span>Зафиксировать обложку</span>
    </button>

    <div class="aux-actions" id="auxActions">
        <button class="aux-btn" id="flipBtn" type="button">🔄 Сменить камеру</button>
        <label class="aux-btn">
            <span>🖼 Выбрать фото</span>
            <input type="file" id="fallbackInput" accept="image/*" capture="environment">
        </label>
    </div>

    <div class="status-box" id="statusBox">
        <div class="status-title" id="statusTitle">🔍 Распознаём обложку...</div>
        <div class="status-desc" id="statusDesc">Нейросеть анализирует иллюстрацию и оформление книги...</div>
        <a href="#" class="direct-link-btn" id="directLinkBtn" target="_top">📖 Открыть учебник сейчас</a>
        <button class="reset-btn" id="resetBtn" type="button">🔄 Сканировать другую книгу</button>
    </div>
</div>

<script>
    const GEMINI_KEY = "AQ.Ab8RN6JdLVSkYlD-cfajCDD9i_0yYH2cy-CG38iOuJjdGSVuEw";
    const video = document.getElementById('videoEl');
    const canvas = document.getElementById('freezeCanvas');
    const fallbackMsg = document.getElementById('fallbackMsg');
    const scanBtn = document.getElementById('scanBtn');
    const flipBtn = document.getElementById('flipBtn');
    const fallbackInput = document.getElementById('fallbackInput');
    const auxActions = document.getElementById('auxActions');
    const laser = document.getElementById('laserEl');
    const statusBox = document.getElementById('statusBox');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');
    const directLinkBtn = document.getElementById('directLinkBtn');
    const resetBtn = document.getElementById('resetBtn');

    let stream = null;
    let frontFacing = false;
    let cameraActive = false;

    async function initCamera() {
        if (stream) {
            stream.getTracks().forEach(t => t.stop());
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            cameraActive = false;
            video.style.display = 'none';
            fallbackMsg.style.display = 'flex';
            return;
        }
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: frontFacing ? "user" : { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 960 }
                },
                audio: false
            });
            video.srcObject = stream;
            video.style.display = 'block';
            fallbackMsg.style.display = 'none';
            cameraActive = true;
        } catch (err) {
            cameraActive = false;
            video.style.display = 'none';
            fallbackMsg.style.display = 'flex';
        }
    }

    initCamera();

    flipBtn.addEventListener('click', () => {
        frontFacing = !frontFacing;
        initCamera();
    });

    resetBtn.addEventListener('click', () => {
        canvas.style.display = 'none';
        laser.style.display = 'none';
        statusBox.style.display = 'none';
        directLinkBtn.style.display = 'none';
        resetBtn.style.display = 'none';
        scanBtn.style.display = 'flex';
        auxActions.style.display = 'flex';
        fallbackInput.value = '';
        if (cameraActive) {
            video.style.display = 'block';
        } else {
            fallbackMsg.style.display = 'flex';
        }
    });

    scanBtn.addEventListener('click', () => {
        if (!cameraActive || !video.videoWidth) {
            fallbackInput.click();
            return;
        }
        const maxW = 720;
        let w = video.videoWidth;
        let h = video.videoHeight;
        if (w > maxW) {
            h = Math.round((h * maxW) / w);
            w = maxW;
        }
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(video, 0, 0, w, h);

        video.style.display = 'none';
        canvas.style.display = 'block';

        const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
        processCover(dataUrl);
    });

    fallbackInput.addEventListener('change', () => {
        if (!fallbackInput.files || !fallbackInput.files[0]) return;
        const file = fallbackInput.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const maxW = 720;
                let w = img.width;
                let h = img.height;
                if (w > maxW) {
                    h = Math.round((h * maxW) / w);
                    w = maxW;
                }
                canvas.width = w;
                canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                video.style.display = 'none';
                fallbackMsg.style.display = 'none';
                canvas.style.display = 'block';

                const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
                processCover(dataUrl);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });

    const PROMPT = "Ты эксперт по школьным учебникам и справочникам. Определи книгу по фото обложки (даже если текста нет или он закрыт — узнай по иллюстрации, дизайну серии и цветовой гамме). Напиши ТОЛЬКО предмет, класс и автора (например: Литература 11 класс Зинин Чалмаев). Никаких кавычек и лишних слов.";

    function cleanAiOutput(raw) {
        if (!raw) return null;
        const firstLine = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean)[0] || "";
        const cleaned = firstLine.replace(/["'*`#]/g, "").trim();
        return cleaned.length >= 3 ? cleaned.slice(0, 85) : null;
    }

    // Движок 1: Мультимодальный Vision ИИ (работает в РФ без VPN и без ключей)
    async function recognizeViaPollinationsVision(dataUrl) {
        const models = ["openai", "mistral", "openai-large"];
        for (const m of models) {
            try {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 8000);
                const res = await fetch("https://text.pollinations.ai/openai", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    signal: ctrl.signal,
                    body: JSON.stringify({
                        model: m,
                        messages: [{
                            role: "user",
                            content: [
                                { type: "text", text: PROMPT },
                                { type: "image_url", image_url: { url: dataUrl } }
                            ]
                        }],
                        temperature: 0.1
                    })
                });
                clearTimeout(timer);
                if (!res.ok) continue;
                const data = await res.json();
                const txt = cleanAiOutput(data.choices?.[0]?.message?.content);
                if (txt) return txt;
            } catch (_) {}
        }
        return null;
    }

    // Движок 2: Резервный вызов Gemini 3.8 Flash
    async function recognizeViaGemini38(dataUrl) {
        const base64Data = dataUrl.split(',')[1];
        const models = ["gemini-3.8-flash", "gemini-3.0-flash"];
        for (const m of models) {
            try {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 6000);
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(GEMINI_KEY)}`;
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    signal: ctrl.signal,
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: PROMPT },
                                { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                            ]
                        }]
                    })
                });
                clearTimeout(timer);
                if (!res.ok) continue;
                const data = await res.json();
                const txt = cleanAiOutput(data.candidates?.[0]?.content?.parts?.[0]?.text);
                if (txt) return txt;
            } catch (_) {}
        }
        return null;
    }

    async function processCover(dataUrl) {
        if (navigator.vibrate) navigator.vibrate(40);

        scanBtn.style.display = 'none';
        auxActions.style.display = 'none';
        laser.style.display = 'block';
        statusBox.style.display = 'block';
        directLinkBtn.style.display = 'none';
        resetBtn.style.display = 'none';

        statusTitle.innerText = "🔍 Фиксация обложки...";
        statusDesc.innerText = "Визуальная нейросеть определяет учебник по обложке...";

        let bookTitle = null;
        try {
            bookTitle = await Promise.any([
                recognizeViaPollinationsVision(dataUrl).then(r => { if (!r) throw new Error(); return r; }),
                recognizeViaGemini38(dataUrl).then(r => { if (!r) throw new Error(); return r; })
            ]);
        } catch (_) {
            bookTitle = null;
        }

        if (!bookTitle) {
            bookTitle = "Учебник школьный ФГОС";
        }

        laser.style.display = 'none';
        statusTitle.innerText = "✅ " + bookTitle;
        statusDesc.innerText = "Открываем готовый сайт со справочным материалом...";

        // Мгновенный редирект сразу на первый сайт с учебником (минуя поисковую выдачу)
        const targetUrl = `https://duckduckgo.com/?q=${encodeURIComponent("!ducky " + bookTitle + " учебник читать онлайн")}`;

        directLinkBtn.href = targetUrl;
        directLinkBtn.style.display = 'block';
        resetBtn.style.display = 'block';

        setTimeout(() => {
            window.location.href = targetUrl;
        }, 700);
    }
</script>

</body>
</html>
